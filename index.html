<style>

    for (j = 0; j < sets.length; j++) { var oc = occs[i], pr = sets[j][1], Rr = run("base", function (m) { m.p.occ_weekday = oc; if (pr) { m.p.price_weekday_pp = pr; m.p.price_weekend_pp = pr; } });
      var e3 = Rr.oy[2].ebitda; h += '<td style="background:' + (e3 >= 0 ? "#e3efe7" : "#fbe3e0") + '"><b>' + kmad(e3) + "</b><br>" + kmad(Rr.controls.low_cash) + "</td>"; }
    h += "</tr>"; }
  h += '</table><p class="note">' + (S.lang === "en" ? "Cell: OY3 EBITDA (bold) / cash low point over 5 years." : "Cellule : EBITDA AE3 (gras) / point bas de trésorerie sur 5 ans.") + "</p></div>";
  // sensitivity 2
  var wes = [0.6, 0.7, 0.8, 0.9], teams = [[S.lang === "en" ? "Lean (−1 reception, −1 housekeeping)" : "Allégée (−1 accueil, −1 housekeeping)", -1], [S.lang === "en" ? "Core roster" : "Équipe de base", 0], [S.lang === "en" ? "Reinforced (+1 reception 6,500)" : "Renforcée (+1 accueil 6 500)", 1]];
  h += '<div class="card"><h2>' + t("sens2") + '</h2><table class="heat"><tr><th>' + t("occ") + " " + t("occWe") + "</th>"; for (j = 0; j < teams.length; j++) h += "<th>" + teams[j][0] + "</th>"; h += "</tr>";
  for (i = 0; i < wes.length; i++) { h += "<tr><td><b>" + pct(wes[i], 0) + "</b></td>";
    for (j = 0; j < teams.length; j++) { var ow = wes[i], tv = teams[j][1], R2 = run("base", function (m) { m.p.occ_weekend = ow; var ro = m.t.roster, k3;
        if (tv < 0) { for (k3 = 0; k3 < ro.length; k3++) if ((ro[k3].pole === "dir" || ro[k3].pole === "hk") && ro[k3].fte >= 2) ro[k3].fte -= 1; }
        if (tv > 0) ro.push({ pole: "dir", label_fr: "+1", label_en: "+1", fte: 1, gross: 6500 }); });
      h += '<td style="background:' + (R2.oy[2].ebitda >= 0 ? "#e3efe7" : "#fbe3e0") + '"><b>' + kmad(R2.oy[2].ebitda) + "</b></td>"; }
    h += "</tr>"; }
  h += "</table></div>";
  S.scenCache = { k: scenKey(), h: h }; el.innerHTML = h; }

/* ---------------- events ---------------- */
function parseNum(s) { return +String(s).replace(/\s| /g, "").replace(",", "."); }
function onChange(e) {
  var el = e.target, d = el.getAttribute ? el : null; if (!d) return;
  if (el.id === "ep") { S.ep = el.value.trim(); lsSet("ep", S.ep); return; }
  var k = el.getAttribute("data-k"), l = el.getAttribute("data-l"), tb = el.getAttribute("data-t");
  if (k) { var r = rowByKey(k); if (!r) return;
    if (r.unit === "date") r.value = el.value; else if (r.unit === "0/1") r.value = el.checked ? 1 : 0;
    else { var v = parseNum(el.value); if (isNaN(v)) { el.value = dispVal(r); return; } r.value = r.unit === "%" ? Math.round(v * 1e6) / 1e8 : v; } }
  else if (l) { var r2 = rowByKey(l); if (r2) r2["label_" + S.lang] = el.value; }
  else if (tb) { var i = +el.getAttribute("data-i"), c = el.getAttribute("data-c"), row = S.cur.tables[tb][i];
    if (c.indexOf("label_") === 0 || c === "resource") row[c] = el.value; else { var v2 = parseNum(el.value); if (isNaN(v2)) return; row[c] = el.getAttribute("data-p") ? Math.round(v2 * 1e6) / 1e8 : v2; } }
  else return;
  recompute(); saveLocal();
  if (S.tab === "hyp") { updateHypLive(); if (el.className.indexOf("chg") < 0 && el.type !== "checkbox") el.className += " chg"; if (tb === "segments" || tb === "channels" || tb === "poles") renderMain(); }
  else render(); }
function onClick(e) {
  var el = e.target; while (el && el !== document.body && !(el.getAttribute && (el.getAttribute("data-act") || el.getAttribute("data-tab") || el.getAttribute("data-scen") || el.getAttribute("data-oy") || el.getAttribute("data-sub") || el.getAttribute("data-grp") || el.getAttribute("data-pset") || el.getAttribute("data-day")))) el = el.parentNode;
  if (!el || el === document.body || !el.getAttribute) return;
  if (el.tagName === "INPUT") return;
  var a = el.getAttribute("data-act"), v;
  if ((v = el.getAttribute("data-tab"))) { S.tab = v; setHash(); render(); window.scrollTo(0, 0); return; }
  if ((v = el.getAttribute("data-scen"))) { S.scen = v; recompute(); render(); return; }
  if ((v = el.getAttribute("data-oy"))) { S.oy = +v; render(); return; }
  if ((v = el.getAttribute("data-sub"))) { S.sub = v; setHash(); renderMain(); return; }
  if ((v = el.getAttribute("data-day"))) { S.day = +v; var dd = $("daydet"); if (dd) dd.innerHTML = dayDetail(S.day); return; }
  if ((v = el.getAttribute("data-grp"))) { if (e.target.tagName === "INPUT") return; S.open[v] = S.open[v] === false; saveLocal(); renderMain(); return; }
  if ((v = el.getAttribute("data-pset"))) { var ref = refPayload(), pv = { A: 2500, B: 3000, C: 3600 }[v], i;
    for (i = 0; i < ref.rows.length; i++) if (ref.rows[i].key === "price_weekday_pp" || ref.rows[i].key === "price_weekend_pp") rowByKey(ref.rows[i].key).value = pv || ref.rows[i].value;
    recompute(); render(); return; }
  if (a === "lang") { S.lang = S.lang === "fr" ? "en" : "fr"; render(); }
  else if (a === "investor") { S.investor = !S.investor; if (S.investor) { S.scen = "base"; S.editLabels = false; initCur(refPayload()); recompute(); } render(); }
  else if (a === "print") printAll();
  else if (a === "json") exportJSON();
  else if (a === "csv") exportCSV();
  else if (a === "sync") syncSheet(true);
  else if (a === "labels") { S.editLabels = !S.editLabels; renderMain(); }
  else if (a === "publish") publish();
  else if (a === "reset") { initCur(refPayload()); recompute(); render(); }
  else if (a === "expand" || a === "collapse") { var P = poleList(); for (var j = 0; j < P.length; j++) S.open[P[j].id] = a === "expand"; saveLocal(); renderMain(); }
  else if (a === "addfree") { var R = S.cur.tables.roster, n = 0; for (var q = 0; q < R.length; q++) if (R[q].pole === "free") n++;
    if (R.length >= 40) return; R.push({ pole: "free", label_fr: "Poste libre " + (n + 1), label_en: "Free position " + (n + 1), fte: 0, gross: 0 }); S.open.free = true; recompute(); renderMain(); updateHypLive(); }
  else if (a === "v1live") readV1(); }
function setHash() { try { history.replaceState(null, "", "#" + S.tab + (S.tab === "hyp" ? "/" + S.sub : "")); } catch (e) { } }
function readHash() { var h = (location.hash || "").replace("#", "").split("/"); if (h[0] && TABFN[h[0]]) S.tab = h[0]; if (h[1] === "ca" || h[1] === "ch") S.sub = h[1]; }
function tipMove(e) { var tp = $("tip"), el = e.target, s = el && el.getAttribute ? el.getAttribute("data-tip") : null;
  if (!s) { tp.style.display = "none"; return; } tp.innerHTML = esc(s); tp.style.display = "block";
  tp.style.left = Math.min(window.innerWidth - 270, e.clientX + 12) + "px"; tp.style.top = (e.clientY + 12) + "px"; }
function download(name, text, type) { try { var b = new Blob([text], { type: type }), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { document.body.removeChild(a); }, 100); } catch (e) { } }
function stamp() { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "_" + p(d.getHours()) + "h" + p(d.getMinutes()); }
function exportJSON() { download("Nur_v2_hypotheses_" + stamp() + ".json", JSON.stringify({ app: APP_VERSION, scenario: S.scen, sheetVersion: S.sheet ? S.sheet.version : null, rows: S.cur.rows, tables: S.cur.tables, controls: S.R.controls }, null, 1), "application/json"); }
function exportCSV() { var W = S.R.weeks, L = ["week;start;oy;room_nights;receipts;deposits;payroll;payments;net;closing"];
  for (var i = 0; i < W.length; i++) L.push([W[i].week, W[i].start, W[i].oy, W[i].rn, W[i].rec.toFixed(2), W[i].depRec.toFixed(2), W[i].payroll.toFixed(2), W[i].pay.toFixed(2), W[i].net.toFixed(2), W[i].close.toFixed(2)].join(";"));
  L.push(""); L.push("oy;revHT;ebitda;net;occupancy;closeCash;dscr");
  for (i = 0; i < 5; i++) { var o = S.R.oy[i]; L.push([o.oy, o.revHT.toFixed(2), o.ebitda.toFixed(2), o.net.toFixed(2), o.occupancy.toFixed(4), o.closeCash.toFixed(2), o.dscr === null ? "" : o.dscr.toFixed(3)].join(";")); }
  download("Nur_v2_cash_" + S.scen + "_" + stamp() + ".csv", "﻿" + L.join("\n"), "text/csv"); }
function printAll() { var keep = S.tab, h = "", op = S.sub; renderChrome();
  for (var i = 0; i < TABS.length; i++) { S.tab = TABS[i];
    if (TABS[i] === "hyp") { S.sub = "ca"; h += '<section class="sec"><h2>' + t("t_hyp") + " — " + t("p_ca") + "</h2>" + TABFN.hyp() + '</section><section class="sec"><h2>' + t("t_hyp") + " — " + t("p_ch") + "</h2>"; S.sub = "ch"; h += TABFN.hyp() + "</section>"; continue; }
    if (TABS[i] === "scen") { fillScenHidden(); h += '<section class="sec"><h2>' + t("t_scen") + "</h2>" + (S.scenCache ? S.scenCache.h : "") + "</section>"; continue; }
    h += '<section class="sec"><h2>' + t("t_" + TABS[i]) + "</h2>" + TABFN[TABS[i]]() + "</section>"; }
  S.tab = keep; S.sub = op; $("main").innerHTML = h; setTimeout(function () { window.print(); renderMain(); }, 60); }
function fillScenHidden() { if (S.scenCache && S.scenCache.k === scenKey()) return; var d = document.createElement("div"); d.id = "scenbody"; d.style.display = "none"; document.body.appendChild(d); fillScen(); document.body.removeChild(d); }

function init() {
  var st = lsGet("state"), cached = lsGet("sheet"); S.ep = lsGet("ep") || (DEFAULT_EP.indexOf("__") === 0 ? "" : DEFAULT_EP);
  if (st) { S.lang = st.lang || "fr"; S.tab = st.tab || "dash"; S.sub = st.sub || "ca"; S.oy = st.oy || 1; S.scen = st.scen || "base"; S.investor = !!st.investor; S.open = st.open || {}; }
  readHash();
  if (cached && cached.rows && S.ep) { S.sheet = cached; S.sheetAt = cached._at; S.fromCache = true; }
  checkIntegrity();
  initCur(refPayload());
  if (st && st.cur && st.cur.rows && st.curRef === (S.sheet ? S.sheet.version : "local:" + BASE.version) && st.cur.rows.length === refPayload().rows.length) S.cur = st.cur; // keep the viewer's sandbox
  recompute(); render();
  document.addEventListener("change", onChange); document.addEventListener("click", onClick); document.addEventListener("mousemove", tipMove);
  window.addEventListener("hashchange", function () { readHash(); render(); });
  if (S.ep) syncSheet(false); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

</script>
